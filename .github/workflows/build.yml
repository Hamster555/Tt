name: Build and simulate Trim Controller

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Compile ESP32-S3 firmware
        run: pio run -e esp32-s3-devkitc-1
      - name: Install Wokwi CLI
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output /usr/local/bin/wokwi-cli \
            https://github.com/wokwi/wokwi-cli/releases/download/v0.29.1/wokwi-cli-linuxstatic-x64
          echo "3c9d6da007d008a3822ab468318037285440055132c59fd659d7306e40f14258  /usr/local/bin/wokwi-cli" | sha256sum --check
          chmod +x /usr/local/bin/wokwi-cli
      - name: Validate Wokwi diagram
        if: env.WOKWI_CLI_TOKEN != ''
        run: wokwi-cli lint --ignore-warnings
      - name: Run Wokwi simulation
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          heap_args=()
          if [ -n "$CI_HEAP_INTERVAL" ]; then heap_args+=(--heap-interval "$CI_HEAP_INTERVAL"); fi
          if [ -n "$CI_HEAP_MIN_FREE" ]; then heap_args+=(--heap-min-free "$CI_HEAP_MIN_FREE"); fi
          if [ -n "$CI_HEAP_CSV" ]; then heap_args+=(--heap-csv "$CI_HEAP_CSV"); fi
          wokwi-cli --timeout "30000" --expect-text "Trim controller Wokwi starter v0.1" \
            --diagram-file "diagram.json" \
            --fail-text "" --scenario "" "${GITHUB_WORKSPACE}/" \
            --serial-log-file "wokwi-serial.log" "${heap_args[@]}"
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
          FORCE_COLOR: 2
          CI_EXPECT_TEXT: Trim controller Wokwi starter v0.1
          CI_FAIL_TEXT: ""
          CI_HEAP_INTERVAL: ""
          CI_HEAP_MIN_FREE: ""
          CI_HEAP_CSV: ""
          CI_ARGS: ""
      - name: Upload Wokwi serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-serial-log
          path: wokwi-serial.log
          if-no-files-found: ignore
